<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3bd74"/>
      <stop offset="1" stop-color="#6b7d3a"/>
    </linearGradient>
  </defs>
  <!-- Two filled quads (the arms). They meet at the tip along a short diagonal
       edge; the far (open) ends are flat vertical cuts, so there are no sharp
       points on the left and no thickness crossing over at the tip. -->
  <path d="M8 11 L46 29 L41 39 L8 25 Z" fill="url(#accent)"/>
  <path d="M46 29 L41 39 L8 53 L8 39 Z" fill="url(#accent)"/>
  <!-- terminal cursor -->
  <rect x="49" y="24" width="6" height="16" fill="url(#accent)"/>
</svg>
