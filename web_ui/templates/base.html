<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CodeAgent{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#9654;</text></svg>">
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/markdown.js"></script>
</head>
<body data-sound="{{ 'off' if sound_enabled is defined and not sound_enabled else 'on' }}">
    <header id="top-bar">
        <a href="/" class="logo" title="Home">CodeAgent</a>
        <nav id="tab-bar"><div class="tab-scroll" id="tab-scroll"></div></nav>
        <a href="/prompts" class="topbar-link" title="Prompts &amp; tools">Prompts</a>
    </header>
    {# Shown when the status poll cannot reach the server, so a stopped backend
       is obvious rather than looking like a frozen page. #}
    <div id="offline-banner" role="status" hidden></div>
    <main id="main-content">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/app.js"></script>
</body>
</html>
